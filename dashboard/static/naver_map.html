<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>GRID 네이버 지도</title>
<style>
  html, body { margin: 0; height: 100%; font-family: "Noto Sans KR", sans-serif; }
  #map { width: 100%; height: 100%; border-radius: 8px; }
  #err { display: none; padding: 16px; font-size: 14px; color: #c92a2a; }
</style>
</head>
<body>
<!-- 대시보드(app.py naver_zone_map)가 iframe으로 띄움. 데이터는 같은 폴더 naver_zones.json {key, half, zones}.
     srcdoc iframe은 네이버 인증에서 주소가 about:srcdoc 로 잡혀 거절되므로 실제 주소(/app/static/)에서 띄운다 -->
<div id="map"></div>
<div id="err">네이버 지도를 불러오지 못했어요. 위 '네이버 지도로 보기'를 끄면 기본 지도로 보여요.</div>
<script>
let CFG = null;

function fail() {
  document.getElementById("map").style.display = "none";
  document.getElementById("err").style.display = "block";
}
window.navermap_authFailure = fail;

function draw() {
  if (!window.naver || !naver.maps || !CFG || !CFG.zones.length) return fail();
  const Z = CFG.zones;
  const lat = Z.reduce((s, z) => s + z.lat, 0) / Z.length;
  const lng = Z.reduce((s, z) => s + z.lng, 0) / Z.length;
  const map = new naver.maps.Map("map", {
    center: new naver.maps.LatLng(lat, lng), zoom: 14,
    mapTypeControl: true, mapTypeControlOptions: { position: naver.maps.Position.TOP_RIGHT },
    zoomControl: true, zoomControlOptions: { position: naver.maps.Position.RIGHT_CENTER },
  });
  const info = new naver.maps.InfoWindow({ borderWidth: 0, backgroundColor: "transparent", disableAnchor: true });
  const dLat = CFG.half / 111320, dLng = CFG.half / (111320 * Math.cos(lat * Math.PI / 180));
  const medal = ["🥇", "🥈", "🥉"];
  for (const z of Z) {
    const top = z.rank <= 3;
    const rect = new naver.maps.Rectangle({
      map,
      bounds: new naver.maps.LatLngBounds(
        new naver.maps.LatLng(z.lat - dLat, z.lng - dLng), new naver.maps.LatLng(z.lat + dLat, z.lng + dLng)),
      fillColor: z.c, fillOpacity: top ? 0.5 : 0.3,
      strokeColor: top ? "#1c1c1c" : z.c, strokeOpacity: top ? 0.9 : 0.6,
      strokeWeight: top ? 3 : Math.min(0.5 + z.demand, 4), clickable: true,
    });
    naver.maps.Event.addListener(rect, "click", (e) => {
      info.setContent(`<div style="padding:8px 10px;background:#fff;border-radius:8px;box-shadow:0 2px 8px #0003;font-size:13px;line-height:1.5">
        <b>${z.rank}위 ${z.name}</b><br>점수 ${z.score} · 열섬 ${z.heat}<br>제안 ${z.p} · 신고 ${z.rp} · 공감 ${z.lk}</div>`);
      info.open(map, e.coord);
    });
    if (top) new naver.maps.Marker({
      map, position: new naver.maps.LatLng(z.lat, z.lng),
      icon: { content: `<div style="transform:translate(-50%,-50%);white-space:nowrap;padding:3px 8px;border-radius:12px;background:#fff;border:2px solid ${z.c};font-weight:700;font-size:12px;box-shadow:0 1px 4px #0003">${medal[z.rank - 1]} ${z.name}</div>` },
    });
  }
}

fetch("naver_zones.json", { cache: "no-store" })
  .then((r) => r.json())
  .then((cfg) => {
    CFG = cfg;
    if (!CFG.key) return fail();
    const s = document.createElement("script");
    s.src = "https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=" + encodeURIComponent(CFG.key);
    s.onload = draw;
    s.onerror = fail;
    document.head.appendChild(s);
  })
  .catch(fail);
</script>
</body>
</html>
